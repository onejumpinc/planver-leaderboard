name: Run Scenario

on:
  workflow_dispatch:

concurrency:
  group: planver-submission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.event.repository.fork == true
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: docker-compose.yml
      PLANVER_AGENT_ID: 'PLANVER_AGENT_ID'
      GREEN_IMAGE: ghcr.io/elliotgestrin/planver-green-agent@sha256:0bdadb2617ddd591542bff64dc69573e20c83fa0cd1ae308f164a6785a7afc5b
      PLANNER_IMAGE: ghcr.io/onejumpinc/planver-classical-agent@sha256:85e91909f1aaa2f58aaa97f7108430dd4bcbbdd9b9eaf263ae83d3481392317e
      CLIENT_IMAGE: ghcr.io/agentbeats/agentbeats-client@sha256:13dfe3ef4e583a80e7ce2fe3becd0ce3b879841368a7f4fa40b6ebbabeeb014e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tomli tomli-w pyyaml requests

      - name: Verify exact scenario
        run: |
          test ! -e .env
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import tomllib

          agent_id = os.environ["PLANVER_AGENT_ID"]
          if not re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
              agent_id,
          ):
              sys.exit(f"PLANVER_AGENT_ID is not a lowercase UUID: {agent_id!r}")

          with open("scenario.toml", "rb") as scenario_file:
              scenario = tomllib.load(scenario_file)

          expected = {
              "green_agent": {
                  "agentbeats_id": "019bc406-77f9-7a13-9fa6-ea6987e19db3",
                  "env": {},
              },
              "participants": [
                  {"agentbeats_id": agent_id, "name": "planner", "env": {}}
              ],
              "config": {
                  "domains": ["barman", "blocksworld", "childsnack", "gripper"],
                  "easy_count": 1,
                  "medium_count": 1,
                  "hard_count": 1,
              },
          }
          if json.dumps(scenario, sort_keys=True) != json.dumps(expected, sort_keys=True):
              sys.exit(f"scenario.toml mismatch:\n{scenario!r}")
          print("Exact 12-task scenario verified")
          PY

      - name: Generate docker-compose.yml
        run: python generate_compose.py --scenario scenario.toml

      - name: Pin and verify exact images
        run: |
          python - <<'PY'
          import os
          import sys
          import yaml

          with open("docker-compose.yml") as compose_file:
              compose = yaml.safe_load(compose_file)

          expected_without_images = {
              "green-agent": {
                  "platform": "linux/amd64",
                  "container_name": "green-agent",
                  "command": [
                      "--host",
                      "0.0.0.0",
                      "--port",
                      "9009",
                      "--card-url",
                      "http://green-agent:9009",
                  ],
                  "environment": ["PYTHONUNBUFFERED=1"],
                  "healthcheck": {
                      "test": [
                          "CMD",
                          "curl",
                          "-f",
                          "http://localhost:9009/.well-known/agent-card.json",
                      ],
                      "interval": "5s",
                      "timeout": "3s",
                      "retries": 10,
                      "start_period": "30s",
                  },
                  "depends_on": {"planner": {"condition": "service_healthy"}},
                  "networks": ["agent-network"],
              },
              "planner": {
                  "platform": "linux/amd64",
                  "container_name": "planner",
                  "command": [
                      "--host",
                      "0.0.0.0",
                      "--port",
                      "9009",
                      "--card-url",
                      "http://planner:9009",
                  ],
                  "environment": ["PYTHONUNBUFFERED=1"],
                  "healthcheck": {
                      "test": [
                          "CMD",
                          "curl",
                          "-f",
                          "http://localhost:9009/.well-known/agent-card.json",
                      ],
                      "interval": "5s",
                      "timeout": "3s",
                      "retries": 10,
                      "start_period": "30s",
                  },
                  "networks": ["agent-network"],
              },
              "agentbeats-client": {
                  "platform": "linux/amd64",
                  "container_name": "agentbeats-client",
                  "volumes": [
                      "./a2a-scenario.toml:/app/scenario.toml",
                      "./output:/app/output",
                  ],
                  "command": ["scenario.toml", "output/results.json"],
                  "depends_on": {
                      "green-agent": {"condition": "service_healthy"},
                      "planner": {"condition": "service_healthy"},
                  },
                  "networks": ["agent-network"],
              },
          }
          if set(compose) != {"services", "networks"}:
              sys.exit(f"Unexpected top-level Compose keys: {sorted(compose)}")
          if compose["networks"] != {"agent-network": {"driver": "bridge"}}:
              sys.exit(f"Unexpected Compose networks: {compose['networks']!r}")
          if set(compose["services"]) != set(expected_without_images):
              sys.exit(f"Unexpected Compose services: {sorted(compose['services'])}")
          for service_name, expected_service in expected_without_images.items():
              service = compose["services"][service_name]
              actual_without_image = {
                  key: value for key, value in service.items() if key != "image"
              }
              if actual_without_image != expected_service:
                  sys.exit(
                      f"Unexpected {service_name} service configuration: "
                      f"{actual_without_image!r}"
                  )

          expected_unpinned_images = {
              "green-agent": "ghcr.io/elliotgestrin/planver-green-agent:latest",
              "planner": os.environ["PLANNER_IMAGE"],
              "agentbeats-client": "ghcr.io/agentbeats/agentbeats-client:v1.0.0",
          }
          actual_unpinned_images = {
              name: service["image"]
              for name, service in compose["services"].items()
          }
          if actual_unpinned_images != expected_unpinned_images:
              sys.exit(
                  "Unexpected API/generated image references: "
                  f"{actual_unpinned_images!r}"
              )

          registered_image = compose["services"]["planner"]["image"]
          expected_image = os.environ["PLANNER_IMAGE"]
          if registered_image != expected_image:
              sys.exit(
                  "PlanVer registration resolved to "
                  f"{registered_image!r}, expected {expected_image!r}"
              )

          compose["services"]["green-agent"]["image"] = os.environ["GREEN_IMAGE"]
          compose["services"]["agentbeats-client"]["image"] = os.environ[
              "CLIENT_IMAGE"
          ]
          with open("docker-compose.yml", "w") as compose_file:
              yaml.safe_dump(compose, compose_file, sort_keys=False)
          PY

          docker compose config --format json | jq -e \
            --arg green "$GREEN_IMAGE" \
            --arg planner "$PLANNER_IMAGE" \
            --arg client "$CLIENT_IMAGE" '
              (.services | keys) == ["agentbeats-client", "green-agent", "planner"]
              and .services["green-agent"].image == $green
              and .services.planner.image == $planner
              and .services["agentbeats-client"].image == $client
              and ([.services[] | select(has("build"))] | length) == 0
            ' >/dev/null

      - name: Pull images
        run: |
          if ! docker compose pull; then
            echo ""
            echo "Error: Failed to pull one or more images."
            echo "Ensure all images are publicly accessible."
            echo "For ghcr.io images, check package settings at:"
            echo "  https://github.com/orgs/YOUR_ORG/packages or"
            echo "  https://github.com/users/YOUR_USER/packages"
            exit 1
          fi

      - name: Create output directory
        run: rm -rf output && mkdir -p output && chmod 777 output

      - name: Run assessment
        run: docker compose up --timestamps --no-color --exit-code-from agentbeats-client --abort-on-container-exit

      - name: Record provenance
        run: python record_provenance.py --compose docker-compose.yml --output output/provenance.json

      - name: Verify exact score and provenance
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          def fail(message):
              sys.exit(f"Gate failed: {message}")

          def number_equals(actual, expected):
              return (
                  type(actual) in (int, float)
                  and type(expected) in (int, float)
                  and actual == expected
              )

          with open("output/results.json") as results_file:
              results = json.load(results_file)

          expected_participants = {"planner": os.environ["PLANVER_AGENT_ID"]}
          if results.get("participants") != expected_participants:
              fail(f"participants={results.get('participants')!r}")

          runs = results.get("results")
          if not isinstance(runs, list) or len(runs) != 1:
              fail("expected exactly one result")
          result = runs[0]

          for key, expected in (
              ("total_tasks", 12),
              ("total_valid", 12),
              ("total_invalid", 0),
              ("total_errors", 0),
              ("overall_success_rate", 1),
          ):
              if not number_equals(result.get(key), expected):
                  fail(f"{key}={result.get(key)!r}, expected {expected}")

          domains = result.get("domain_results")
          names = (
              [domain.get("domain") for domain in domains]
              if isinstance(domains, list)
              else None
          )
          expected_names = ["barman", "blocksworld", "childsnack", "gripper"]
          if names is None or sorted(names) != expected_names:
              fail(f"domains={names!r}")

          for domain in domains:
              name = domain["domain"]
              for key, expected in (
                  ("total_tasks", 3),
                  ("valid_plans", 3),
                  ("invalid_plans", 0),
                  ("errors", 0),
                  ("success_rate", 1),
              ):
                  if not number_equals(domain.get(key), expected):
                      fail(f"{name}.{key}={domain.get(key)!r}, expected {expected}")

              difficulties = domain.get("results_by_difficulty")
              if (
                  not isinstance(difficulties, dict)
                  or sorted(difficulties) != ["easy", "hard", "medium"]
              ):
                  fail(f"{name}.results_by_difficulty={difficulties!r}")
              for difficulty, values in difficulties.items():
                  for key, expected in (
                      ("total", 1),
                      ("valid", 1),
                      ("invalid", 0),
                      ("errors", 0),
                  ):
                      if not number_equals(values.get(key), expected):
                          fail(
                              f"{name}.{difficulty}.{key}={values.get(key)!r}, "
                              f"expected {expected}"
                          )

          with open("output/provenance.json") as provenance_file:
              provenance = json.load(provenance_file)
          expected_digests = {
              "green-agent": os.environ["GREEN_IMAGE"],
              "planner": os.environ["PLANNER_IMAGE"],
              "agentbeats-client": os.environ["CLIENT_IMAGE"],
          }
          if provenance.get("image_digests") != expected_digests:
              fail(
                  "provenance image_digests="
                  f"{provenance.get('image_digests')!r}"
              )

          print("Exact 12/12 score and immutable provenance verified")
          PY

      - name: Generate submission metadata
        id: metadata
        run: |
          timestamp=$(date +%Y%m%d-%H%M%S)
          username='${{ github.repository_owner }}'
          unique_name="${username}-${timestamp}"
          {
            echo "unique_name=${unique_name}"
            echo "branch_name=submission-${unique_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Copy files to submission directory
        run: |
          cp scenario.toml "submissions/${{ steps.metadata.outputs.unique_name }}.toml"
          cp output/results.json "results/${{ steps.metadata.outputs.unique_name }}.json"
          cp output/provenance.json "submissions/${{ steps.metadata.outputs.unique_name }}.provenance.json"

      - name: Determine target repository
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent_repo=$(gh api "repos/${{ github.repository }}" \
            --jq '.parent.full_name // "${{ github.repository }}"')
          echo "Target repository: ${parent_repo}"
          echo "repo=${parent_repo}" >> "$GITHUB_OUTPUT"

      - name: Create submission branch
        run: |
          git remote add upstream "https://github.com/${{ steps.target.outputs.repo }}.git"
          git fetch upstream
          git checkout -b "${{ steps.metadata.outputs.branch_name }}" upstream/main

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            "submissions/${{ steps.metadata.outputs.unique_name }}.toml" \
            "submissions/${{ steps.metadata.outputs.unique_name }}.provenance.json" \
            "results/${{ steps.metadata.outputs.unique_name }}.json"
          git commit -m "Submission: ${{ steps.metadata.outputs.unique_name }}

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "${{ steps.metadata.outputs.branch_name }}"
          echo "::notice title=Submission Branch Created::Your results are ready for submission on branch: ${{ steps.metadata.outputs.branch_name }}"

      - name: Output PR link
        run: |
          {
            echo "### Submit your results"
            echo "[Click here to open a pull request](https://github.com/${{ steps.target.outputs.repo }}/compare/main...${{ github.repository_owner }}:${{ github.event.repository.name }}:${{ steps.metadata.outputs.branch_name }}?expand=1)"
            echo ""
            echo "⚠️ When creating the PR, UNCHECK 'Allow edits and access to secrets by maintainers' to protect your secrets."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: docker compose down -v || true
